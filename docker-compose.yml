services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data/storage
    volumes:
      - ./backend/app:/app/app
      - storage_data:/data/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data/storage
    volumes:
      - ./backend/app:/app/app
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.worker

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data/storage
    volumes:
      - ./backend/app:/app/app
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.scheduler

  # Production static build (nginx serves the compiled app). Bound to 127.0.0.1 only —
  # the system nginx (Certbot-managed, /etc/nginx/sites-available/webdock)
  # reverse-proxies public HTTPS traffic to 127.0.0.1:5173.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  storage_data:
